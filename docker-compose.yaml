services:
  db:
    image: mysql 
    environment:
      - MYSQL_ROOT_PASSWORD=root_pwd
      - MYSQL_USER=new_user
      - MYSQL_PASSWORD=my_pwd
    ports:
      - 3306:3306
    networks:
      - app-networks

  api:
    image: givasques1101/checkpoint1-microservices:0.0.1
    depends_on:
      - db
    ports:
      - 8080:8080
    environment:
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_DATABASE=api
      - DB_USER=root
      - DB_PASSWORD=root_pwd
    networks:
      - app-networks

networks:
  app-networks: